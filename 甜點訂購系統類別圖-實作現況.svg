<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
  <defs>
    <style>
      text { font-family: "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif; fill: #172033; }
      .title { font-size: 31px; font-weight: 700; } .subtitle { font-size: 15px; fill: #556070; }
      .zone { fill: #fbfcff; stroke: #9aafd0; stroke-width: 1.5; } .zoneTitle { font-size: 18px; font-weight: 700; fill: #234c82; }
      .box { fill: #fff; stroke-width: 1.5; rx: 8; } .head { font-size: 16px; font-weight: 700; fill: #fff; }
      .line { font-size: 13px; } .note { font-size: 12px; fill: #536174; } .small { font-size: 11px; fill: #536174; }
      .controller { stroke: #3177c8; } .service { stroke: #28815e; } .repo { stroke: #b87a0b; } .entity { stroke: #c54d5b; } .ai { stroke: #7357b8; } .store { stroke: #64748b; }
      .hcontroller { fill: #3177c8; } .hservice { fill: #28815e; } .hrepo { fill: #b87a0b; } .hentity { fill: #c54d5b; } .hai { fill: #7357b8; } .hstore { fill: #64748b; }
      .rel { stroke: #536174; stroke-width: 1.4; fill: none; marker-end: url(#arrow); } .dep { stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow); }
      .cache { stroke: #e05252; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; marker-end: url(#redArrow); } .mongo { stroke: #28815e; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; marker-end: url(#greenArrow); } .vector { stroke: #b87a0b; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; marker-end: url(#orangeArrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#536174"/></marker>
    <marker id="redArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e05252"/></marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#28815e"/></marker>
    <marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b87a0b"/></marker>
  </defs>
  <rect width="1800" height="1220" fill="#f4f7fb"/>
  <text x="900" y="48" text-anchor="middle" class="title">甜點訂購系統 - High-Level Class Diagram（目前實作）</text>
  <text x="900" y="76" text-anchor="middle" class="subtitle">依 src/main/java 與 application.yml 繪製；虛線為依賴或資料存取，非 UML 繼承關係</text>

  <rect x="28" y="100" width="1270" height="260" rx="12" class="zone"/><text x="48" y="130" class="zoneTitle">Web / 業務層</text>
  <g transform="translate(55,152)"><rect width="275" height="170" class="box controller"/><rect width="275" height="32" class="hcontroller" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">DessertOrderController</text><text x="15" y="57" class="line">+ createDessert() / getDessert()</text><text x="15" y="79" class="line">+ updateDessert() / deleteDessert()</text><text x="15" y="101" class="line">+ createOrder() / getOrder(s)()</text><text x="15" y="123" class="line">+ deleteOrder() / purge...</text><text x="15" y="151" class="note">/api/desserts, /api/orders</text></g>
  <g transform="translate(365,152)"><rect width="275" height="170" class="box ai"/><rect width="275" height="32" class="hai" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">DessertAiChatController</text><text x="15" y="57" class="line">+ chat(request)</text><text x="15" y="79" class="line">+ getChatHistory(sessionId)</text><text x="15" y="107" class="note">/api/ai/chat</text></g>
  <g transform="translate(675,152)"><rect width="275" height="170" class="box ai"/><rect width="275" height="32" class="hai" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">RagAdminController</text><text x="15" y="57" class="line">+ ingestText() / ingestDesserts()</text><text x="15" y="79" class="line">+ search() / deleteDocuments()</text><text x="15" y="107" class="note">/api/admin/rag</text></g>
  <g transform="translate(985,152)"><rect width="275" height="170" class="box ai"/><rect width="275" height="32" class="hai" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">CsvKnowledgeUploadController</text><text x="15" y="57" class="line">+ uploadDesserts() / uploadFaq()</text><text x="15" y="79" class="line">+ uploadKeywordRules()</text><text x="15" y="107" class="note">CSV 知識匯入</text></g>

  <rect x="28" y="390" width="1270" height="255" rx="12" class="zone"/><text x="48" y="420" class="zoneTitle">Service 層</text>
  <g transform="translate(55,444)"><rect width="275" height="155" class="box service"/><rect width="275" height="32" class="hservice" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">DessertServiceImpl : DessertService</text><text x="15" y="57" class="line">+ create / findAll / getById</text><text x="15" y="79" class="line">+ update / delete / deleteAll</text><text x="15" y="101" class="line">+ deductStock()</text><text x="15" y="132" class="note">甜點 CRUD、快取與原子扣庫存</text></g>
  <g transform="translate(365,444)"><rect width="275" height="155" class="box ai"/><rect width="275" height="32" class="hai" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">AiChatService</text><text x="15" y="57" class="line">+ chat()</text><text x="15" y="79" class="line">- resolveHits() / callLlm()</text><text x="15" y="101" class="line">- recordSideEffects()</text><text x="15" y="132" class="note">關鍵字比對、RAG、LLM 回覆</text></g>
  <g transform="translate(675,444)"><rect width="275" height="155" class="box ai"/><rect width="275" height="32" class="hai" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">RAG Ingestion Services</text><text x="15" y="57" class="line">RagDocumentService</text><text x="15" y="79" class="line">RagKnowledgeIngestionService</text><text x="15" y="101" class="line">KeywordChatService</text><text x="15" y="132" class="note">Document 轉換、分塊、寫入與規則比對</text></g>
  <g transform="translate(985,444)"><rect width="275" height="155" class="box ai"/><rect width="275" height="32" class="hai" rx="8"/><text x="137" y="22" text-anchor="middle" class="head">MongoDataTrackingService</text><text x="15" y="57" class="line">+ saveChatMessage()</text><text x="15" y="79" class="line">+ recordSearch() / logAction()</text><text x="15" y="101" class="line">+ submitReview() / getHistory()</text><text x="15" y="132" class="note">MongoDB 行為資料與評論</text></g>

  <rect x="28" y="675" width="1270" height="335" rx="12" class="zone"/><text x="48" y="705" class="zoneTitle">Repository 與 Domain Model</text>
  <g transform="translate(55,730)"><rect width="180" height="130" class="box repo"/><rect width="180" height="32" class="hrepo" rx="8"/><text x="90" y="22" text-anchor="middle" class="head">DessertRepository</text><text x="12" y="57" class="line">JpaRepository&lt;Dessert&gt;</text><text x="12" y="80" class="line">+ deductStock()</text><text x="12" y="103" class="line">+ findByDeletedFalse()</text></g>
  <g transform="translate(255,730)"><rect width="180" height="130" class="box repo"/><rect width="180" height="32" class="hrepo" rx="8"/><text x="90" y="22" text-anchor="middle" class="head">OrderRepository</text><text x="12" y="57" class="line">JpaRepository&lt;Order&gt;</text><text x="12" y="80" class="line">+ softDeleteById()</text><text x="12" y="103" class="line">+ findByDeletedFalse()</text></g>
  <g transform="translate(455,730)"><rect width="180" height="130" class="box repo"/><rect width="180" height="32" class="hrepo" rx="8"/><text x="90" y="22" text-anchor="middle" class="head">OrderItemRepository</text><text x="12" y="57" class="line">JpaRepository&lt;OrderItem&gt;</text></g>
  <g transform="translate(675,730)"><rect width="230" height="130" class="box entity"/><rect width="230" height="32" class="hentity" rx="8"/><text x="115" y="22" text-anchor="middle" class="head">Dessert (@Entity)</text><text x="12" y="57" class="line">id, name, price, stock</text><text x="12" y="80" class="line">enabled, deleted</text><text x="12" y="108" class="note">甜點主檔</text></g>
  <g transform="translate(935,730)"><rect width="160" height="170" class="box entity"/><rect width="160" height="32" class="hentity" rx="8"/><text x="80" y="22" text-anchor="middle" class="head">Order (@Entity)</text><text x="12" y="57" class="line">id, customerName</text><text x="12" y="79" class="line">phone, lineId</text><text x="12" y="101" class="line">totalAmount</text><text x="12" y="123" class="line">orderTime, deleted</text><text x="12" y="145" class="line">items : List&lt;OrderItem&gt;</text></g>
  <g transform="translate(1125,730)"><rect width="160" height="170" class="box entity"/><rect width="160" height="32" class="hentity" rx="8"/><text x="80" y="22" text-anchor="middle" class="head">OrderItem (@Entity)</text><text x="12" y="57" class="line">id, order</text><text x="12" y="79" class="line">dessertId</text><text x="12" y="101" class="line">dessertName</text><text x="12" y="123" class="line">unitPrice, quantity</text><text x="12" y="145" class="line">lineTotal</text></g>
  <g transform="translate(55,890)"><rect width="580" height="90" class="box ai"/><rect width="580" height="30" class="hai" rx="8"/><text x="290" y="21" text-anchor="middle" class="head">MongoDB Documents / Repositories</text><text x="14" y="54" class="line">ChatMessageHistory, SearchHistory, ActionLog, ProductReview, SystemConfig, KeywordRuleEntity</text><text x="14" y="76" class="note">各自對應 Spring Data Mongo Repository</text></g>

  <rect x="1330" y="100" width="440" height="910" rx="12" class="zone"/><text x="1350" y="130" class="zoneTitle">外部服務與資料儲存</text>
  <g transform="translate(1360,160)"><rect width="365" height="105" class="box store"/><rect width="365" height="32" class="hstore" rx="8"/><text x="182" y="22" text-anchor="middle" class="head">MySQL (dessert_db)</text><text x="16" y="58" class="line">JPA: dessert, orders, order_item</text><text x="16" y="81" class="note">業務交易與庫存原子 UPDATE</text></g>
  <g transform="translate(1360,295)"><rect width="365" height="105" class="box store"/><rect width="365" height="32" fill="#d94848" rx="8"/><text x="182" y="22" text-anchor="middle" class="head">Redis</text><text x="16" y="58" class="line">key: dessert:item:{id}, TTL 10 分鐘</text><text x="16" y="81" class="note">Dessert 單筆 Cache Aside</text></g>
  <g transform="translate(1360,430)"><rect width="365" height="105" class="box store"/><rect width="365" height="32" fill="#28815e" rx="8"/><text x="182" y="22" text-anchor="middle" class="head">MongoDB (dessert_ai_db)</text><text x="16" y="58" class="line">對話、搜尋、操作日誌、評論、規則</text><text x="16" y="81" class="note">Spring Data MongoDB</text></g>
  <g transform="translate(1360,565)"><rect width="365" height="105" class="box store"/><rect width="365" height="32" fill="#b87a0b" rx="8"/><text x="182" y="22" text-anchor="middle" class="head">MongoDB Atlas Vector Store</text><text x="16" y="58" class="line">Document chunks + embeddings</text><text x="16" y="81" class="note">RAG 相似度檢索與知識庫</text></g>
  <g transform="translate(1360,700)"><rect width="365" height="105" class="box store"/><rect width="365" height="32" fill="#4285f4" rx="8"/><text x="182" y="22" text-anchor="middle" class="head">Google GenAI (Gemini)</text><text x="16" y="58" class="line">gemini-2.5-flash / gemini-embedding-001</text><text x="16" y="81" class="note">ChatClient 與 EmbeddingModel</text></g>
  <g transform="translate(1360,840)"><rect width="365" height="115" class="box" stroke="#8b5cf6"/><rect width="365" height="32" fill="#8b5cf6" rx="8"/><text x="182" y="22" text-anchor="middle" class="head">關鍵設計限制</text><text x="16" y="57" class="small">OrderItem 保留甜點名稱、單價快照；dessertId</text><text x="16" y="77" class="small">為純欄位，非 Dessert 的 JPA 關聯。</text><text x="16" y="99" class="small">MongoDB 與 MySQL 間不建立跨庫外鍵。</text></g>

  <path d="M330 237 H365" class="dep"/><path d="M640 237 H675" class="dep"/><path d="M950 237 H985" class="dep"/>
  <path d="M192 322 V444" class="dep"/><path d="M502 322 V444" class="dep"/><path d="M812 322 V444" class="dep"/><path d="M1122 322 V444" class="dep"/>
  <path d="M192 599 V730" class="dep"/><path d="M502 599 V730 H1450 V265" class="cache"/><path d="M812 599 V730 H1542 V670" class="vector"/><path d="M1122 599 V730 H1542 V535" class="mongo"/>
  <path d="M235 795 H675" class="dep"/><path d="M435 795 H935" class="dep"/><path d="M635 795 H1125" class="dep"/>
  <path d="M1095 815 H1125" class="rel"/><text x="1100" y="805" class="small">1</text><text x="1110" y="855" class="small">*</text>
  <path d="M905 795 H1360" class="dep"/><path d="M1285 815 H1360" class="dep"/>
  <path d="M640 520 H1360" class="dep"/><path d="M950 520 H1360" class="mongo"/><path d="M640 500 H1360 V752" class="dep"/>
  <text x="70" y="1060" class="subtitle">圖例：實線 = 實體關聯；灰虛線 = 程式依賴；紅虛線 = Redis 快取；綠虛線 = MongoDB 存取；橘虛線 = 向量庫存取。</text>
  <text x="70" y="1090" class="note">未納入：尚未實作為正式 API 模組的 Member、Cart、Category，以及完整 Review Controller/Service 流程。</text>
</svg>
